<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MediaPipe 视觉模型功能演示：食指隔空长按 HUD 卡片，实时切换 Face Detector / Face Landmarker / Gesture Recognizer / Hand Landmarker。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MediaPipe Vision Demo</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="preview-stage" id="preview-stage">
        <video
          id="camera-video"
          class="camera-video"
          autoplay
          muted
          playsinline
          aria-label="摄像头预览画面"
        ></video>

        <canvas
          id="helmet-canvas"
          class="helmet-canvas"
          aria-label="Face Landmarker 3D 科幻头盔叠加层"
          hidden
        ></canvas>

        <canvas
          id="overlay-canvas"
          class="landmark-canvas"
          aria-label="模型捕捉关键点叠加层"
          hidden
        ></canvas>

        <canvas
          id="effects-canvas"
          class="effects-canvas"
          aria-label="Gesture Recognizer three.js 手势特效层"
          hidden
        ></canvas>

        <div
          id="face-reaction"
          class="face-reaction"
          aria-hidden="true"
        >
          <div class="face-reaction-card">
            <span class="face-reaction-halo" aria-hidden="true"></span>
            <span
              id="face-reaction-emoji-a"
              class="face-reaction-emoji"
              aria-hidden="true"
            ></span>
            <span
              id="face-reaction-emoji-b"
              class="face-reaction-emoji"
              aria-hidden="true"
            ></span>
            <span id="face-reaction-caption" class="face-reaction-caption"></span>
          </div>
        </div>

        <div id="preview-overlay" class="preview-overlay">
          <section id="intro-panel" class="intro-panel" aria-live="polite">
            <p class="eyebrow">Web Demo</p>
            <h1>MediaPipe Vision</h1>
            <p id="status-text" class="status-text">
              开启摄像头后，抬起手用食指“隔空长按”右侧卡片，即可切换演示模型。
            </p>
            <p class="camera-privacy-note">
              摄像头画面仅用于本地实时推理，不会上传、保存或分享。关闭页面或撤销浏览器摄像头权限后，识别即停止。
            </p>
            <button id="start-camera" class="primary-action" type="button">
              开启摄像头
            </button>
          </section>

          <section
            id="loading-panel"
            class="intro-panel loading-panel"
            aria-live="polite"
            aria-busy="false"
            hidden
          >
            <p class="eyebrow">正在准备体验</p>
            <h2 id="loading-stage" class="loading-stage">正在加载手势交互引擎</h2>
            <div class="loading-stage-list" aria-hidden="true">
              <span class="loading-stage-complete">✓ 摄像头已就绪</span>
              <span class="loading-stage-active">交互引擎加载中</span>
            </div>
            <div
              id="loading-progress"
              class="loading-progress"
              role="progressbar"
              aria-label="手势交互引擎加载进度"
              aria-valuetext="正在加载"
            >
              <span class="loading-progress-bar"></span>
            </div>
            <p id="loading-detail" class="status-text loading-detail">
              首次访问需要下载识别组件，请保持页面开启。
            </p>
          </section>

          <div id="hud-left" class="hud-left" hidden>
            <p id="model-hud-tag" class="model-hud-tag hud-hideable" aria-hidden="true">
              MEDIAPIPE VISION // HAND LANDMARKER
            </p>

            <aside id="info-panel" class="info-panel hud-hideable" aria-live="polite">
              <p class="info-panel-heading">
                <span id="info-name-en" class="info-panel-title">Hand Landmarker</span>
                <span id="info-name-cn" class="info-panel-subtitle">手部关键点</span>
              </p>
              <p id="info-purpose" class="info-panel-line"></p>
              <p id="info-output" class="info-panel-line"></p>
              <p id="info-principle" class="info-panel-line"></p>
            </aside>

            <p class="model-rail-tag model-rail-tag-secondary hud-hideable" aria-hidden="true">
              OVERLAY // LANDMARKS
            </p>

            <button
              id="landmarks-toggle"
              class="planet-focus-action-card model-card landmarks-toggle hud-hideable"
              type="button"
              aria-label="长按隐藏捕捉关键点"
              aria-pressed="true"
              tabindex="-1"
            >
              <span class="planet-focus-action-card-corners" aria-hidden="true"></span>
              <span class="planet-focus-action-card-edge" aria-hidden="true"></span>
              <span class="planet-focus-action-card-fill" aria-hidden="true"></span>
              <span class="planet-focus-action-card-scan" aria-hidden="true"></span>
              <span class="planet-focus-action-card-reactor" aria-hidden="true">
                <span class="planet-focus-action-card-ring"></span>
                <span class="planet-focus-action-card-ring-progress"></span>
                <svg class="planet-focus-action-card-icon" viewBox="0 0 32 32" focusable="false">
                  <path d="M5.5 16S9.5 9.5 16 9.5 26.5 16 26.5 16 22.5 22.5 16 22.5 5.5 16 5.5 16z"></path>
                  <circle cx="16" cy="16" r="3.2"></circle>
                </svg>
              </span>
              <span class="planet-focus-action-card-copy">
                <span id="landmarks-toggle-label" class="planet-focus-action-card-label">
                  长按隐藏捕捉关键点
                </span>
                <span id="landmarks-toggle-hint" class="planet-focus-action-card-hint">
                  LANDMARKS · ON
                </span>
              </span>
              <span class="planet-focus-action-card-readout" aria-hidden="true">
                <span class="planet-focus-action-card-duration">T-0.5s</span>
                <span class="planet-focus-action-card-state">
                  <span class="planet-focus-action-card-state-ready">READY</span>
                  <span class="planet-focus-action-card-state-charging">CHARGING</span>
                </span>
              </span>
            </button>

            <button
              id="reaction-demo-toggle"
              class="planet-focus-action-card model-card reaction-demo-toggle hud-hideable"
              type="button"
              aria-label="长按开启表情演示"
              aria-pressed="false"
              tabindex="-1"
              hidden
            >
              <span class="planet-focus-action-card-corners" aria-hidden="true"></span>
              <span class="planet-focus-action-card-edge" aria-hidden="true"></span>
              <span class="planet-focus-action-card-fill" aria-hidden="true"></span>
              <span class="planet-focus-action-card-scan" aria-hidden="true"></span>
              <span class="planet-focus-action-card-reactor" aria-hidden="true">
                <span class="planet-focus-action-card-ring"></span>
                <span class="planet-focus-action-card-ring-progress"></span>
                <svg class="planet-focus-action-card-icon" viewBox="0 0 32 32" focusable="false">
                  <circle cx="16" cy="16" r="10"></circle>
                  <circle cx="12" cy="13" r="1"></circle>
                  <circle cx="20" cy="13" r="1"></circle>
                  <path d="M11 19c1.4 1.8 3 2.7 5 2.7s3.6-.9 5-2.7"></path>
                </svg>
              </span>
              <span class="planet-focus-action-card-copy">
                <span id="reaction-demo-toggle-label" class="planet-focus-action-card-label">
                  长按开启表情演示
                </span>
                <span id="reaction-demo-toggle-hint" class="planet-focus-action-card-hint">
                  REACTIONS · OFF
                </span>
              </span>
              <span class="planet-focus-action-card-readout" aria-hidden="true">
                <span class="planet-focus-action-card-duration">T-0.5s</span>
                <span class="planet-focus-action-card-state">
                  <span class="planet-focus-action-card-state-ready">READY</span>
                  <span class="planet-focus-action-card-state-charging">CHARGING</span>
                  <span class="planet-focus-action-card-state-active">ACTIVE</span>
                </span>
              </span>
            </button>

            <button
              id="ui-toggle"
              class="planet-focus-action-card model-card ui-toggle"
              type="button"
              aria-label="长按隐藏界面"
              aria-pressed="false"
              tabindex="-1"
            >
              <span class="planet-focus-action-card-corners" aria-hidden="true"></span>
              <span class="planet-focus-action-card-edge" aria-hidden="true"></span>
              <span class="planet-focus-action-card-fill" aria-hidden="true"></span>
              <span class="planet-focus-action-card-scan" aria-hidden="true"></span>
              <span class="planet-focus-action-card-reactor" aria-hidden="true">
                <span class="planet-focus-action-card-ring"></span>
                <span class="planet-focus-action-card-ring-progress"></span>
                <svg class="planet-focus-action-card-icon" viewBox="0 0 32 32" focusable="false">
                  <rect x="6" y="8" width="20" height="16" rx="2"></rect>
                  <path d="M13 8v16"></path>
                </svg>
              </span>
              <span class="planet-focus-action-card-copy">
                <span id="ui-toggle-label" class="planet-focus-action-card-label">
                  长按隐藏界面
                </span>
                <span id="ui-toggle-hint" class="planet-focus-action-card-hint">
                  INTERFACE · ON
                </span>
              </span>
              <span class="planet-focus-action-card-readout" aria-hidden="true">
                <span class="planet-focus-action-card-duration">T-0.5s</span>
                <span class="planet-focus-action-card-state">
                  <span class="planet-focus-action-card-state-ready">READY</span>
                  <span class="planet-focus-action-card-state-charging">CHARGING</span>
                </span>
              </span>
            </button>
          </div>

          <section
            id="model-rail"
            class="model-rail hud-hideable"
            aria-label="模型切换卡组"
            hidden
          >
            <p class="model-rail-tag" aria-hidden="true">MODEL SELECT // MEDIAPIPE</p>

            <button
              id="model-card-face_detector"
              class="planet-focus-action-card model-card"
              type="button"
              data-model="face_detector"
              aria-label="长按演示人脸检测"
              tabindex="-1"
            >
              <span class="planet-focus-action-card-corners" aria-hidden="true"></span>
              <span class="planet-focus-action-card-edge" aria-hidden="true"></span>
              <span class="planet-focus-action-card-fill" aria-hidden="true"></span>
              <span class="planet-focus-action-card-scan" aria-hidden="true"></span>
              <span class="planet-focus-action-card-reactor" aria-hidden="true">
                <span class="planet-focus-action-card-ring"></span>
                <span class="planet-focus-action-card-ring-progress"></span>
                <svg class="planet-focus-action-card-icon" viewBox="0 0 32 32" focusable="false">
                  <rect x="7" y="7" width="18" height="18" rx="3"></rect>
                  <circle cx="13" cy="14" r="1.2"></circle>
                  <circle cx="19" cy="14" r="1.2"></circle>
                  <path d="M12.5 19.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8"></path>
                </svg>
              </span>
              <span class="planet-focus-action-card-copy">
                <span class="planet-focus-action-card-label">长按演示 人脸检测</span>
                <span class="planet-focus-action-card-hint">MODEL · FACE DETECTOR</span>
              </span>
              <span class="planet-focus-action-card-readout" aria-hidden="true">
                <span class="planet-focus-action-card-duration">T-0.5s</span>
                <span class="planet-focus-action-card-state">
                  <span class="planet-focus-action-card-state-ready">READY</span>
                  <span class="planet-focus-action-card-state-charging">CHARGING</span>
                  <span class="planet-focus-action-card-state-active">ACTIVE</span>
                </span>
              </span>
            </button>

            <button
              id="model-card-face_landmarker"
              class="planet-focus-action-card model-card"
              type="button"
              data-model="face_landmarker"
              aria-label="长按演示人脸网格"
              tabindex="-1"
            >
              <span class="planet-focus-action-card-corners" aria-hidden="true"></span>
              <span class="planet-focus-action-card-edge" aria-hidden="true"></span>
              <span class="planet-focus-action-card-fill" aria-hidden="true"></span>
              <span class="planet-focus-action-card-scan" aria-hidden="true"></span>
              <span class="planet-focus-action-card-reactor" aria-hidden="true">
                <span class="planet-focus-action-card-ring"></span>
                <span class="planet-focus-action-card-ring-progress"></span>
                <svg class="planet-focus-action-card-icon" viewBox="0 0 32 32" focusable="false">
                  <path d="M16 6.5c5.2 0 8.5 3.9 8.5 8.7 0 5.4-3.6 10.3-8.5 10.3s-8.5-4.9-8.5-10.3c0-4.8 3.3-8.7 8.5-8.7z"></path>
                  <path d="M7.8 13.5h16.4"></path>
                  <path d="M8.4 19h15.2"></path>
                  <path d="M16 6.5v19"></path>
                  <path d="M10.2 8.8l11.6 13.4"></path>
                  <path d="M21.8 8.8L10.2 22.2"></path>
                </svg>
              </span>
              <span class="planet-focus-action-card-copy">
                <span class="planet-focus-action-card-label">长按演示 人脸网格</span>
                <span class="planet-focus-action-card-hint">MODEL · FACE LANDMARKER</span>
              </span>
              <span class="planet-focus-action-card-readout" aria-hidden="true">
                <span class="planet-focus-action-card-duration">T-0.5s</span>
                <span class="planet-focus-action-card-state">
                  <span class="planet-focus-action-card-state-ready">READY</span>
                  <span class="planet-focus-action-card-state-charging">CHARGING</span>
                  <span class="planet-focus-action-card-state-active">ACTIVE</span>
                </span>
              </span>
            </button>

            <button
              id="model-card-gesture_recognizer"
              class="planet-focus-action-card model-card"
              type="button"
              data-model="gesture_recognizer"
              aria-label="长按演示手势识别"
              tabindex="-1"
            >
              <span class="planet-focus-action-card-corners" aria-hidden="true"></span>
              <span class="planet-focus-action-card-edge" aria-hidden="true"></span>
              <span class="planet-focus-action-card-fill" aria-hidden="true"></span>
              <span class="planet-focus-action-card-scan" aria-hidden="true"></span>
              <span class="planet-focus-action-card-reactor" aria-hidden="true">
                <span class="planet-focus-action-card-ring"></span>
                <span class="planet-focus-action-card-ring-progress"></span>
                <svg class="planet-focus-action-card-icon" viewBox="0 0 32 32" focusable="false">
                  <path d="M13 25v-8"></path>
                  <path d="M13 17l-4.5-7.5"></path>
                  <path d="M13 17l5.5-9"></path>
                  <path d="M13 25c3.8 0 6.5-2.2 6.5-6"></path>
                  <circle cx="13" cy="26.5" r="1.8"></circle>
                </svg>
              </span>
              <span class="planet-focus-action-card-copy">
                <span class="planet-focus-action-card-label">长按演示 手势识别</span>
                <span class="planet-focus-action-card-hint">MODEL · GESTURE RECOGNIZER</span>
              </span>
              <span class="planet-focus-action-card-readout" aria-hidden="true">
                <span class="planet-focus-action-card-duration">T-0.5s</span>
                <span class="planet-focus-action-card-state">
                  <span class="planet-focus-action-card-state-ready">READY</span>
                  <span class="planet-focus-action-card-state-charging">CHARGING</span>
                  <span class="planet-focus-action-card-state-active">ACTIVE</span>
                </span>
              </span>
            </button>

            <button
              id="model-card-hand_landmarker"
              class="planet-focus-action-card model-card"
              type="button"
              data-model="hand_landmarker"
              aria-label="长按演示手部关键点"
              tabindex="-1"
            >
              <span class="planet-focus-action-card-corners" aria-hidden="true"></span>
              <span class="planet-focus-action-card-edge" aria-hidden="true"></span>
              <span class="planet-focus-action-card-fill" aria-hidden="true"></span>
              <span class="planet-focus-action-card-scan" aria-hidden="true"></span>
              <span class="planet-focus-action-card-reactor" aria-hidden="true">
                <span class="planet-focus-action-card-ring"></span>
                <span class="planet-focus-action-card-ring-progress"></span>
                <svg class="planet-focus-action-card-icon" viewBox="0 0 32 32" focusable="false">
                  <path d="M16 24V9"></path>
                  <path d="m16 14-5-6"></path>
                  <path d="m16 14 5-7"></path>
                  <path d="m16 17-8-3"></path>
                  <path d="m16 18 8-2"></path>
                  <circle cx="16" cy="25" r="2.5"></circle>
                </svg>
              </span>
              <span class="planet-focus-action-card-copy">
                <span class="planet-focus-action-card-label">长按演示 手部关键点</span>
                <span class="planet-focus-action-card-hint">MODEL · HAND LANDMARKER</span>
              </span>
              <span class="planet-focus-action-card-readout" aria-hidden="true">
                <span class="planet-focus-action-card-duration">T-0.5s</span>
                <span class="planet-focus-action-card-state">
                  <span class="planet-focus-action-card-state-ready">READY</span>
                  <span class="planet-focus-action-card-state-charging">CHARGING</span>
                  <span class="planet-focus-action-card-state-active">ACTIVE</span>
                </span>
              </span>
            </button>

          </section>

          <div id="error-banner" class="error-banner" role="alert" hidden>
            <p id="error-banner-text" class="error-banner-text"></p>
            <button id="error-banner-retry" class="error-banner-retry" type="button">
              重试
            </button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
